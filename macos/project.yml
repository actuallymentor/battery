name: Battery
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # The one copy of the team id. Xcode signs with it (Debug clears DEVELOPMENT_TEAM, release archives ad hoc and sign later),
    # the daemon embeds it (BatteryTeamID below) to pin its XPC callers, scripts/release/lib.sh reads it from here.
    BATTERY_TEAM_ID: CAWM399GFD
    DEVELOPMENT_TEAM: $(BATTERY_TEAM_ID)
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 2.0.0-dev
    CURRENT_PROJECT_VERSION: 1
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      # Ad-hoc dev builds can't pass library validation for the embedded Sparkle.framework
      ENABLE_HARDENED_RUNTIME: NO
      # Contributors build without a team: `xcodegen && xcodebuild -scheme Battery build` just works
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      DEVELOPMENT_TEAM: ""
packages:
  BatteryCore: { path: . }
  # scripts/release/lib.sh reads this version (and BATTERY_TEAM_ID, SUPublicEDKey) from this file, keep the one-line form
  Sparkle: { url: "https://github.com/sparkle-project/Sparkle", exactVersion: 2.10.1 }

targets:

  # Menubar app. Embeds the daemon plist, daemon binary and CLI.
  Battery:
    type: application
    platform: macOS
    sources: [ App, Shared ]
    dependencies:
      - package: BatteryCore
        product: BatteryCore
      - package: Sparkle
        product: Sparkle
      - target: batteryd
        embed: false
      - target: BatteryCLI
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Battery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        # Updates are opt-in (#412): no automatic checks until the user turns them on in Settings.
        # Feed hosting is still undecided (.notes/HUMAN.md); release assets is the working default.
        SUFeedURL: https://github.com/actuallymentor/battery/releases/latest/download/appcast.xml
        SUPublicEDKey: xmO49bUIPl43rec5rtC1NoTg5LAFEnVwqnToYuz+NZ0=
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.palokaj.battery
        PRODUCT_NAME: Battery
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Battery.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    # Daemon + CLI + launchd plist land inside the bundle
    postbuildScripts:
      - name: Embed daemon and CLI
        script: |
          set -eu
          APP="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Library/LaunchDaemons" "$APP/Contents/Helpers"
          cp "${BUILT_PRODUCTS_DIR}/batteryd" "$APP/Contents/MacOS/batteryd"
          cp "${BUILT_PRODUCTS_DIR}/battery" "$APP/Contents/Helpers/battery"
          cp "${SRCROOT}/Daemon/co.palokaj.battery.daemon.plist" "$APP/Contents/Library/LaunchDaemons/"
        basedOnDependencyAnalysis: false

  # Root daemon: SMC access, maintain loop, XPC server.
  batteryd:
    type: tool
    platform: macOS
    sources: [ Daemon, Shared ]
    dependencies:
      - package: BatteryCore
        product: BatteryCore
    # Embedded in the binary (__info_plist). The daemon pins its XPC callers to BatteryTeamID; Debug builds skip the check.
    info:
      path: Daemon/Info.plist
      properties:
        BatteryTeamID: $(BATTERY_TEAM_ID)
    settings:
      base:
        PRODUCT_NAME: batteryd
        PRODUCT_BUNDLE_IDENTIFIER: co.palokaj.battery.daemon
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

  # CLI: thin XPC client. Target name differs from the product (`battery`) because Battery.app collides with it on case-insensitive disks.
  BatteryCLI:
    type: tool
    platform: macOS
    sources: [ CLI, Shared ]
    dependencies:
      - package: BatteryCore
        product: BatteryCore
    settings:
      base:
        PRODUCT_NAME: battery
        PRODUCT_MODULE_NAME: BatteryCLI
        PRODUCT_BUNDLE_IDENTIFIER: co.palokaj.battery.cli
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

schemes:
  Battery:
    build:
      targets: { Battery: all }
    run: { config: Debug }
    archive: { config: Release }
