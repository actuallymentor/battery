name: Tray app deterministic tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tray-app-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tray display test
        run: node app/scripts/test-tray-display.js
      - name: Run menu-bar-only visibility test
        run: node app/scripts/test-app-visibility.js
