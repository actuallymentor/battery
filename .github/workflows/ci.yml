# Pull request and branch checks. No secrets, no signing: tests plus an unsigned build of every target.
# Also the verify stage of release.yml (workflow_call): a tag never ships code that fails here.

name: CI

on:
  pull_request:
  push:
    branches: [ main, 'v2/**' ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift test
        working-directory: macos
        run: swift test

  app:
    name: Build app, daemon and CLI (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xcode26
      - name: Generate project
        run: brew install xcodegen && cd macos && xcodegen generate
      - name: Build unsigned
        working-directory: macos
        run: xcodebuild -scheme Battery -configuration Debug -destination 'platform=macOS' -derivedDataPath build build
