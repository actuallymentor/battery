<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battery Optimizer</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.96);
            --panel-border: rgba(148, 163, 184, 0.18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --good: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 36%),
                radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 34%),
                var(--bg);
        }

        .card {
            height: 100vh;
            padding: 18px 18px 16px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.24);
            color: #bae6fd;
            font-size: 12px;
            white-space: nowrap;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.52);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .label {
            font-size: 13px;
            color: var(--text);
        }

        .value {
            font-variant-numeric: tabular-nums;
            color: #cbd5e1;
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .floor-group[aria-hidden="true"] {
            display: none;
        }

        .actions {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font: inherit;
            cursor: pointer;
        }

        .secondary {
            background: rgba(148, 163, 184, 0.14);
            color: var(--text);
        }

        .primary {
            background: linear-gradient(180deg, var(--accent), var(--accent-strong));
            color: #052235;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.26);
        }

        .hint {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">
            <div>
                <h1>Battery Optimizer</h1>
                <p class="subtitle">Adjust the charging ceiling and optional floor from the menu bar.</p>
            </div>
            <div class="badge">Menu bar popup</div>
        </div>

        <div class="section">
            <div class="checkbox-row">
                <input id="floor-enabled" type="checkbox" />
                <label class="label" for="floor-enabled">Enable floor limit</label>
            </div>
            <p class="hint">When enabled, charging stops at the ceiling and resumes only after the floor is reached.</p>
        </div>

        <div class="section floor-group" id="floor-group" aria-hidden="true">
            <div class="row">
                <div class="label">Floor</div>
                <div class="value" id="floor-value">50%</div>
            </div>
            <input id="floor" type="range" min="1" max="99" step="1" value="50" />
        </div>

        <div class="section">
            <div class="row">
                <div class="label">Ceiling</div>
                <div class="value" id="ceiling-value">80%</div>
            </div>
            <input id="ceiling" type="range" min="2" max="100" step="1" value="80" />
        </div>

        <div class="actions">
            <button class="secondary" id="cancel">Cancel</button>
            <button class="primary" id="apply">Apply</button>
        </div>
    </div>

    <script src="./limits.js"></script>
</body>
</html>
